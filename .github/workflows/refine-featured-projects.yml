name: Refine featured projects layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-featured-projects.yml'

jobs:
  update-featured-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update featured projects layout
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          new_css = '''.projects{
            background:var(--off-white);
            padding:96px clamp(24px,6vw,88px);
            position:relative;
            overflow:hidden;
            border-top:1px solid rgba(15,76,107,0.08);
            border-bottom:1px solid rgba(15,76,107,0.08);
          }
          .projects>*{position:relative;z-index:1;}
          .projects-header{
            max-width:1180px;
            margin:0 auto 34px;
            display:flex;
            justify-content:space-between;
            align-items:flex-end;
            gap:32px;
          }
          .projects-kicker{
            margin:0 0 10px;
            font-size:12px;
            font-weight:900;
            letter-spacing:.14em;
            text-transform:uppercase;
            color:var(--teal-dark);
          }
          .projects-title{
            font-size:clamp(38px,5vw,64px);
            font-weight:900;
            line-height:1;
            margin:0;
          }
          .projects-intro{
            max-width:410px;
            margin:0;
            color:rgba(26,26,26,0.66);
            font-size:16px;
            line-height:1.55;
            font-weight:650;
          }
          .projects-grid{
            max-width:1180px;
            margin:0 auto;
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:24px;
          }
          .project-card{
            min-height:100%;
            display:grid;
            grid-template-rows:auto 1fr;
            overflow:hidden;
            border-radius:8px;
            background:#fff;
            border:1px solid rgba(15,76,107,0.14);
            box-shadow:0 18px 44px rgba(15,76,107,0.10);
            cursor:none;
            transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
          }
          .project-card.beige,.project-card.teal-card{background:#fff;}
          .project-card:hover{
            transform:translateY(-6px);
            border-color:rgba(15,76,107,0.26);
            box-shadow:0 26px 58px rgba(15,76,107,0.15);
          }
          .project-card-img{
            width:100%;
            aspect-ratio:16/10;
            padding:18px;
            overflow:hidden;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#f9f5e7 0%,#eaf6f7 100%);
            border-bottom:1px solid rgba(15,76,107,0.12);
          }
          .project-card.teal-card .project-card-img{background:linear-gradient(135deg,#d9f2f1 0%,#f7f9fb 100%);}
          .project-card-img img{
            width:100%;
            height:100%;
            object-fit:contain;
            border-radius:6px;
            box-shadow:0 10px 28px rgba(15,76,107,0.16);
            background:#fff;
            transition:transform .35s ease;
          }
          .project-card:hover .project-card-img img{transform:scale(1.015);}
          .project-card-info{
            display:flex;
            flex-direction:column;
            gap:16px;
            padding:26px 28px 28px;
          }
          .project-card-topline{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            font-size:11px;
            font-weight:900;
            letter-spacing:.12em;
            text-transform:uppercase;
            color:rgba(26,26,26,0.46);
          }
          .project-card-type{color:var(--teal-dark);text-align:right;}
          .project-card-title{
            font-size:clamp(24px,2.4vw,32px);
            font-weight:900;
            line-height:1.15;
            margin:0;
          }
          .project-card-desc{
            margin:0;
            font-size:15px;
            color:rgba(26,26,26,0.66);
            line-height:1.6;
            font-weight:650;
          }
          .project-meta{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-top:auto;
          }
          .project-meta span{
            border:1px solid rgba(15,76,107,0.14);
            background:rgba(255,255,255,0.78);
            border-radius:999px;
            padding:7px 10px;
            font-size:12px;
            line-height:1;
            font-weight:850;
            color:rgba(26,26,26,0.68);
          }
          .project-view{
            display:inline-flex;
            align-items:center;
            align-self:flex-start;
            margin-top:4px;
            font-size:13px;
            font-weight:900;
            letter-spacing:.08em;
            text-transform:uppercase;
            color:var(--dark);
            text-decoration:none;
            border-bottom:2px solid currentColor;
            padding-bottom:3px;
            transition:opacity .2s ease, transform .2s ease;
          }
          .project-view:hover{opacity:.62;transform:translateX(3px);}
          '''
          new_section = '''  <section class="projects" id="projects-anchor">
              <div class="projects-header reveal">
                <div>
                  <p class="projects-kicker">Selected work</p>
                  <h2 class="projects-title">Featured Projects</h2>
                </div>
                <p class="projects-intro">Two redesigns focused on clearer paths, stronger information architecture, and calmer coach-facing workflows.</p>
              </div>
              <div class="projects-grid">
                <article class="project-card beige reveal" onclick="go('cs1')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('cs1');}">
                  <div class="project-card-img"><img src="assets/fp-resource-center.png" alt="FP Resource Center interface preview" loading="lazy" decoding="async"></div>
                  <div class="project-card-info">
                    <div class="project-card-topline"><span>01</span><span class="project-card-type">Tool hub redesign</span></div>
                    <h3 class="project-card-title">FP Resource Center Redesign</h3>
                    <p class="project-card-desc">Reorganized a scattered resource hub into a clearer, more consistent workspace for coaches to find tools and guidance quickly.</p>
                    <div class="project-meta"><span>Information architecture</span><span>UI systems</span><span>Coach workflows</span></div>
                    <a href="#" class="project-view" onclick="go('cs1');return false;">View case study →</a>
                  </div>
                </article>
                <article class="project-card teal-card reveal" onclick="go('cs2')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('cs2');}">
                  <div class="project-card-img"><img src="assets/focal-point-library.png" alt="Focal Point Library dashboard preview" loading="lazy" decoding="async"></div>
                  <div class="project-card-info">
                    <div class="project-card-topline"><span>02</span><span class="project-card-type">Library experience</span></div>
                    <h3 class="project-card-title">Focal Point Library Redesign</h3>
                    <p class="project-card-desc">Turned a static homepage into a dashboard-style library with clearer entry points for events, resources, and coach actions.</p>
                    <div class="project-meta"><span>Dashboard UX</span><span>Content strategy</span><span>Visual design</span></div>
                    <a href="#" class="project-view" onclick="go('cs2');return false;">View case study →</a>
                  </div>
                </article>
              </div>
            </section>
          '''
          old_mobile = '''  .projects{padding:48px 24px;}
            .project-card{flex-direction:column;}
            .project-card-img{height:200px;width:100%;}
            .project-card-img img{border-radius:0 0 16px 16px;}
            .project-card-info{flex:none;width:100%;padding:28px;}'''
          new_mobile = '''  .projects{padding:64px 20px;}
            .projects-header{display:block;margin-bottom:28px;}
            .projects-intro{margin-top:14px;max-width:none;}
            .projects-grid{grid-template-columns:1fr;gap:20px;}
            .project-card-info{padding:24px;}
            .project-card-img{padding:12px;aspect-ratio:16/10;}'''
          css_start = html.index('.projects{')
          css_end = html.index('.about-section{', css_start)
          html = html[:css_start] + new_css + html[css_end:]
          if old_mobile not in html:
              raise SystemExit('Expected mobile projects block not found')
          html = html.replace(old_mobile, new_mobile, 1)
          section_start = html.index('  <section class="projects" id="projects-anchor">')
          section_end = html.index('  <section class="about-section"', section_start)
          html = html[:section_start] + new_section + html[section_end:]
          path.write_text(html)
          PY
      - name: Commit layout update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/refine-featured-projects.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve featured projects layout"
            git push
          fi
