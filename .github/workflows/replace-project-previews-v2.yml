name: Replace project previews v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-project-previews-v2.yml'

jobs:
  update-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply clearer SVG previews
        run: |
          python <<'PY'
          import base64
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          workflow = Path('.github/workflows/replace-project-previews.yml').read_text()
          fp_match = re.search(r'^\s*FP_PREVIEW_B64:\s*(\S+)', workflow, re.MULTILINE)
          lib_match = re.search(r'^\s*LIB_PREVIEW_B64:\s*(\S+)', workflow, re.MULTILINE)
          if not fp_match or not lib_match:
              raise SystemExit('Could not find embedded SVG payloads')

          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          fp_path = assets / 'fp-resource-center-preview.svg'
          lib_path = assets / 'focal-point-library-preview.svg'
          fp_path.write_bytes(base64.b64decode(fp_match.group(1)))
          lib_path.write_bytes(base64.b64decode(lib_match.group(1)))
          ET.parse(fp_path)
          ET.parse(lib_path)

          path = Path('index.html')
          html = path.read_text()
          html = html.replace('assets/fp-resource-center.png', 'assets/fp-resource-center-preview.svg')
          html = html.replace('assets/focal-point-library.png', 'assets/focal-point-library-preview.svg')
          html = html.replace(
              '<div style="overflow:hidden;aspect-ratio:16/10;"><img src="assets/focal-point-library-preview.svg" style="width:100%;height:100%;object-fit:cover;"></div>',
              '<div style="overflow:hidden;aspect-ratio:16/10;background:#fff;"><img src="assets/focal-point-library-preview.svg" style="width:100%;height:100%;object-fit:contain;"></div>'
          )
          html = html.replace(
              '<div style="overflow:hidden;aspect-ratio:16/10;direction:ltr;"><img src="assets/fp-resource-center-preview.svg" style="width:100%;height:100%;object-fit:cover;"></div>',
              '<div style="overflow:hidden;aspect-ratio:16/10;direction:ltr;background:#fff;"><img src="assets/fp-resource-center-preview.svg" style="width:100%;height:100%;object-fit:contain;"></div>'
          )
          path.write_text(html)
          PY
      - name: Commit preview update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/fp-resource-center-preview.svg assets/focal-point-library-preview.svg
          git rm .github/workflows/replace-project-previews.yml .github/workflows/replace-project-previews-v2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace project previews with clearer mockups"
            git push
          fi
