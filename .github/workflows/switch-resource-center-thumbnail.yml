name: Switch Resource Center thumbnail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-resource-center-thumbnail.yml'

permissions:
  contents: write

jobs:
  switch-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Resource Center image references
        run: |
          set -euo pipefail
          perl -0pi -e 's#assets/fp-resource-center-clean-preview\.svg#assets/fp-resource-center-thumbnail-20260913.jpg#g' index.html
          perl -0pi -e 's#assets/fp-resource-center-thumbnail-20260912\.jpg#assets/fp-resource-center-thumbnail-20260913.jpg#g' index.html
      - name: Commit update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Switch Resource Center thumbnail"
            git push
          fi
