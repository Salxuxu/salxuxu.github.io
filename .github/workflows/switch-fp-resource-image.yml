name: Switch FP Resource Center Image

on:
  push:
    paths:
      - .github/workflows/switch-fp-resource-image.yml

permissions:
  contents: write

jobs:
  switch-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch FP preview image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL "https://tmpfiles.org/dl/1789278664.739230a390017eac/wKwZPhvEsdYi/fp-840-q55.jpg" -o assets/fp-resource-center-preview.jpg
          python3 - <<'PY'
          from pathlib import Path
          img = Path('assets/fp-resource-center-preview.jpg').read_bytes()
          assert img[:3] == b'\xff\xd8\xff' and len(img) > 50000
          p = Path('index.html')
          s = p.read_text()
          old = 'assets/fp-resource-center-preview.svg'
          new = 'assets/fp-resource-center-preview.jpg'
          assert old in s, 'old FP preview reference not found'
          s = s.replace(old, new)
          p.write_text(s)
          assert new in s and old not in s
          PY
          git rm .github/workflows/switch-fp-resource-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/fp-resource-center-preview.jpg
          git commit -m "Switch FP Resource Center preview image"
          git push
