name: Replace project previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-project-previews.yml'

jobs:
  update-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write clearer SVG previews
        env:
          FP_PREVIEW_B64: 
          LIB_PREVIEW_B64: 
        run: |
          mkdir -p assets
          printf '%s' "$FP_PREVIEW_B64" | base64 --decode > assets/fp-resource-center-preview.svg
          printf '%s' "$LIB_PREVIEW_B64" | base64 --decode > assets/focal-point-library-preview.svg
          python <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          html = html.replace('assets/fp-resource-center.png', 'assets/fp-resource-center-preview.svg')
          html = html.replace('assets/focal-point-library.png', 'assets/focal-point-library-preview.svg')
          html = html.replace(
              '<div style="overflow:hidden;aspect-ratio:16/10;"><img src="assets/focal-point-library-preview.svg" style="width:100%;height:100%;object-fit:cover;"></div>',
              '<div style="overflow:hidden;aspect-ratio:16/10;background:#fff;"><img src="assets/focal-point-library-preview.svg" style="width:100%;height:100%;object-fit:contain;"></div>'
          )
          html = html.replace(
              '<div style="overflow:hidden;aspect-ratio:16/10;direction:ltr;"><img src="assets/fp-resource-center-preview.svg" style="width:100%;height:100%;object-fit:cover;"></div>',
              '<div style="overflow:hidden;aspect-ratio:16/10;direction:ltr;background:#fff;"><img src="assets/fp-resource-center-preview.svg" style="width:100%;height:100%;object-fit:contain;"></div>'
          )
          path.write_text(html)
          PY
          xmllint --noout assets/fp-resource-center-preview.svg assets/focal-point-library-preview.svg
      - name: Commit preview update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/fp-resource-center-preview.svg assets/focal-point-library-preview.svg
          git rm .github/workflows/replace-project-previews.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace project previews with clearer mockups"
            git push
          fi
