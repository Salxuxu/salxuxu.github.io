name: Switch Resource Center preview to lo-fi SVG

on:
  push:
    paths:
      - .github/workflows/switch-resource-center-lofi.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Swap preview references
        run: |
          set -euo pipefail
          test -f assets/fp-resource-center-lofi-preview.svg
          grep -q 'assets/fp-resource-center-preview.jpg' index.html
          perl -0pi -e 's#assets/fp-resource-center-preview\.jpg#assets/fp-resource-center-lofi-preview.svg#g' index.html
          grep -q 'assets/fp-resource-center-lofi-preview.svg' index.html
          ! grep -q 'assets/fp-resource-center-preview.jpg' index.html
          git rm .github/workflows/switch-resource-center-lofi.yml
      - name: Commit update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/fp-resource-center-lofi-preview.svg
          git commit -m "Switch Resource Center preview to lo-fi SVG"
          git push
